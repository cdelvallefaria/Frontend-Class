<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio de Fotografía</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Luz y Momentos</h1>
    <p>Portafolio de fotografía</p>
    <nav>
      <a href="#galeria">Galería</a>
      <a href="#sobre-mi">Sobre mí</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <main>
    <section id="galeria">
      <h2>Galería</h2>
      <div class="galeria">
        <figure>
          <img src="imagenes/img1.jpeg" alt="Fotografía 1">
          <figcaption>Atardecer</figcaption>
        </figure>
        <figure>
          <img src="imagenes/img2.jpeg" alt="Fotografía 2">
          <figcaption>Ciudad</figcaption>
        </figure>
        <figure>
          <img src="imagenes/img3.jpeg" alt="Fotografía 3">
          <figcaption>Naturaleza</figcaption>
        </figure>
        <figure>
          <img src="imagenes/img4.jpeg" alt="Fotografía 4">
          <figcaption>Retrato</figcaption>
        </figure>
        <figure>
          <img src="imagenes/img5.jpeg" alt="Fotografía 5">
          <figcaption>Playa</figcaption>
        </figure>
        <figure>
          <img src="imagenes/img6.jpeg" alt="Fotografía 6">
          <figcaption>Calle</figcaption>
        </figure>
      </div>
    </section>

    <section id="sobre-mi">
      <h2>Sobre mí</h2>
      <p>Hola, soy fotógrafa aficionada. Me gusta capturar la luz, los paisajes y los pequeños momentos del día a día.</p>
    </section>

    <section id="contacto">
      <h2>Contacto</h2>
      <p>Escríbeme a: <a href="mailto:tu_correo@ejemplo.com">tu_correo@ejemplo.com</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Luz y Momentos. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
